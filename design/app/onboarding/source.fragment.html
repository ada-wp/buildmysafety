<style>
#safety-onboarding{--sn-paper:#faf7f2;--sn-ink:#2e2b4d;--sn-muted:#696376;--sn-lilac:#eee8f6;--sn-line:#e3dce6;--sn-radius:28px;font-family:Inter,Arial,sans-serif;color:var(--sn-ink);max-width:393px;margin:0 auto}
#safety-onboarding *{box-sizing:border-box}
#safety-onboarding .sn-phone{background:var(--sn-paper);border-radius:var(--sn-radius);min-height:700px;display:flex;flex-direction:column;overflow:hidden}
#safety-onboarding .sn-content{padding:22px 24px 26px;flex:1}
#safety-onboarding button,#safety-onboarding input,#safety-onboarding textarea{font:inherit;color:inherit}
#safety-onboarding button{background:none;border:0;min-height:44px}
#safety-onboarding button:disabled{opacity:.45}
#safety-onboarding .sn-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:22px}
#safety-onboarding .sn-wordmark{font-size:13px;letter-spacing:.02em}
#safety-onboarding .sn-text{font-size:12px;color:var(--sn-muted);padding:0;display:inline-flex;align-items:center;gap:5px}
#safety-onboarding .sn-icon{min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:10px}
#safety-onboarding h1{font-family:'Instrument Serif',Georgia,serif;font-size:44px;line-height:1.04;letter-spacing:-.6px;font-weight:400;margin:0 0 20px}
#safety-onboarding h2{font-size:14px;font-weight:500;margin:0}
#safety-onboarding p{font-size:14px;line-height:1.7;margin:0 0 20px;color:var(--sn-muted)}
#safety-onboarding .sn-companion{display:flex;align-items:center;gap:16px;margin:2px 0 26px;padding:15px 17px;background:var(--sn-lilac);border-radius:20px}
#safety-onboarding .sn-companion img{width:72px;height:72px;object-fit:contain}
#safety-onboarding .sn-companion p{font-size:12px;margin:5px 0 0}
#safety-onboarding .sn-mini{width:42px;height:42px;object-fit:contain}
#safety-onboarding .sn-section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
#safety-onboarding .sn-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sn-line);padding:12px 0}
#safety-onboarding .sn-check{flex:none;width:44px;padding:10px;display:grid;place-items:center}
#safety-onboarding .sn-circle{border:1px solid #afa6bc;border-radius:50%;height:23px;width:23px;display:grid;place-items:center}
#safety-onboarding .sn-circle.done{background:var(--sn-ink);color:var(--sn-paper);border-color:var(--sn-ink)}
#safety-onboarding .sn-open{font-size:14px!important;text-align:left;flex:1;padding:3px 0;line-height:1.5;display:block}
#safety-onboarding small{display:block;font-size:11px;color:var(--sn-muted);line-height:1.5;margin-top:5px}
#safety-onboarding .sn-nav{display:flex;gap:8px;padding:12px 20px 20px;border-top:1px solid var(--sn-line);background:var(--sn-paper)}
#safety-onboarding .sn-nav[hidden]{display:none}
#safety-onboarding .sn-nav button{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;border-radius:19px;min-height:50px;font-size:13px}
#safety-onboarding .sn-nav button[aria-current="page"]{background:var(--sn-lilac);font-weight:500}
#safety-onboarding .sn-primary{width:100%;min-height:50px;border-radius:28px;background:var(--sn-ink);color:var(--sn-paper);padding:14px 18px;font-size:13px;font-weight:500;margin-top:24px;line-height:1.5}
#safety-onboarding .sn-secondary{width:100%;font-size:12px;color:var(--sn-muted);margin-top:4px}
#safety-onboarding .sn-choice{display:flex;align-items:center;gap:14px;min-height:67px;width:100%;text-align:left;border-bottom:1px solid var(--sn-line);padding:13px 0;font-size:14px}
#safety-onboarding .sn-choice .sn-next{margin-left:auto}
#safety-onboarding .sn-choice input{accent-color:var(--sn-ink);height:19px;width:19px;flex:none}
#safety-onboarding .sn-choice span{line-height:1.6}
#safety-onboarding .sn-field-label{display:block;font-size:12px;margin:22px 0 8px}
#safety-onboarding textarea{display:block;width:100%;min-height:84px;resize:vertical;border:1px solid var(--sn-line);border-radius:14px;padding:12px;background:var(--sn-paper);font-size:16px;line-height:1.5}
#safety-onboarding .sn-tag{display:inline-block;font-size:11px;line-height:1.5;background:var(--sn-lilac);border-radius:24px;padding:6px 10px;margin-right:9px}
#safety-onboarding .sn-meta{font-size:12px;color:var(--sn-muted);margin-bottom:15px}
#safety-onboarding .sn-idea{border-bottom:1px solid var(--sn-line);padding:18px 0}
#safety-onboarding .sn-idea-head{display:flex;gap:8px;align-items:start}
#safety-onboarding .sn-idea p{font-size:12px;margin:7px 0 0}
#safety-onboarding .sn-add{flex:none;width:44px;border:1px solid var(--sn-line);border-radius:50%;display:grid;place-items:center}
#safety-onboarding .sn-add[disabled]{opacity:1;background:var(--sn-lilac);border-color:var(--sn-lilac)}
#safety-onboarding .sn-steps{list-style:none;padding:0;display:grid;gap:20px;margin:25px 0}
#safety-onboarding .sn-steps li{display:grid;grid-template-columns:27px 1fr;gap:12px;font-size:13px;line-height:1.65}
#safety-onboarding .sn-number{border-radius:50%;height:27px;background:var(--sn-lilac);display:grid;place-items:center;font-size:11px}
#safety-onboarding .sn-outcome{padding:15px 16px;background:#f1ede8;border-radius:15px;font-size:12px;line-height:1.65;margin-bottom:20px}
#safety-onboarding .sn-outcome strong{font-weight:500;font-size:11px;display:block;margin-bottom:4px}
#safety-onboarding details{border-bottom:1px solid var(--sn-line)}
#safety-onboarding summary{min-height:50px;padding:12px 0;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none}
#safety-onboarding summary::-webkit-details-marker{display:none}
#safety-onboarding details p,#safety-onboarding details li{font-size:12px;line-height:1.65}
#safety-onboarding details a{color:var(--sn-ink);display:inline-block;padding:10px 0;font-size:12px}
#safety-onboarding details ul{padding:0 0 12px 18px;margin:0}
#safety-onboarding .sn-celebrate{text-align:center;padding:5px 0 14px}
#safety-onboarding .sn-celebrate>img{width:175px;height:175px;margin:16px 0}
#safety-onboarding .sn-celebrate h1{margin-top:22px}
#safety-onboarding .sn-note{background:var(--sn-lilac);padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.6;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#safety-onboarding .sn-empty{padding:38px 8px;text-align:center}
#safety-onboarding .sn-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#safety-onboarding .sn-done-list{margin-top:20px}
#safety-onboarding .sn-done-list .sn-row:last-child{border:0}
@media(max-width:359px){#safety-onboarding .sn-content{padding-left:20px;padding-right:20px}#safety-onboarding h1{font-size:39px}}
#safety-onboarding .sn-preview-label{font-family:Inter,Arial,sans-serif;font-size:11px;line-height:1.6;color:var(--sn-muted);text-align:center;margin:0;padding:8px 12px;background:var(--sn-paper);border-radius:14px 14px 0 0}
#safety-onboarding .sn-input{width:100%;min-height:52px;border:1px solid #c9c1cf;border-radius:12px;background:#fffdf9;padding:12px;font-size:16px;line-height:1.5}
#safety-onboarding .sn-code{text-align:center;letter-spacing:.35em;font-size:24px}
#safety-onboarding .sn-error{font-size:12px;color:#863b4f;margin:14px 0 0}
#safety-onboarding .sn-fine{font-size:11px;line-height:1.65;margin:17px 0;text-align:center}
#safety-onboarding .sn-auth-art{text-align:center;margin:18px 0}
#safety-onboarding .sn-auth-art img{width:80px;height:80px}
#safety-onboarding .sn-auth-art+h1{text-align:center}
#safety-onboarding .sn-auth-art+h1+p{text-align:center}
#safety-onboarding .sn-empty h2{margin:0 0 12px}
#safety-onboarding .sn-note{margin:0 0 18px}
#safety-onboarding .sn-reward-elephant{display:block;margin:18px auto 22px!important;transform-origin:50% 80%}
#safety-onboarding .sn-celebrate .sn-outcome{margin:18px 0}
#safety-onboarding [data-growth="rhythm"] .sn-companion img{width:84px;height:84px}
#safety-onboarding [data-growth="friendship"] .sn-companion img{width:94px;height:94px}
#safety-onboarding [data-growth="rhythm"] .sn-reward-elephant{width:190px;height:190px}
#safety-onboarding [data-growth="friendship"] .sn-reward-elephant{width:205px;height:205px}

#safety-onboarding .sn-content{padding:22px 24px 26px}
#safety-onboarding .sn-primary{background:var(--ob-action,#3e5044);color:var(--sn-paper)}
#safety-onboarding .ob-page{display:flex;flex-direction:column;min-height:670px}
#safety-onboarding .ob-page .sn-top{margin-bottom:18px}
#safety-onboarding .ob-welcome{text-align:center}
#safety-onboarding .ob-welcome-art{margin:20px auto 27px;display:flex;align-items:center;justify-content:center}
#safety-onboarding .ob-pet{display:block;width:138px;height:138px;object-fit:contain}
#safety-onboarding .ob-welcome h1{font-size:43px;line-height:1.08;letter-spacing:-.5px;margin-bottom:22px}
#safety-onboarding .ob-welcome p{font-size:13px;line-height:1.8;margin:0 auto 14px;max-width:32ch}
#safety-onboarding .ob-footer{margin-top:auto;padding-top:20px}
#safety-onboarding .ob-footer .sn-primary{margin-top:0}
#safety-onboarding .ob-footer>small{text-align:center;font-size:11px;margin-top:15px}
#safety-onboarding .ob-progress-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--sn-muted);margin:0 0 10px}
#safety-onboarding .ob-progress{height:3px;background:var(--sn-lilac);border-radius:3px;margin:0 0 26px;overflow:hidden}
#safety-onboarding .ob-progress span{display:block;height:100%;background:#a59abc;border-radius:3px}
#safety-onboarding #ob-question{font-size:35px;line-height:1.13;letter-spacing:-.25px;margin:0 0 10px;text-wrap:pretty}
#safety-onboarding .ob-hint{font-size:12px;line-height:1.6;margin:0 0 20px}
#safety-onboarding .ob-reply{display:flex;align-items:center;gap:12px;padding:12px 13px;background:var(--sn-lilac);border-radius:17px;margin:0 0 22px}
#safety-onboarding .ob-reply-pet{width:41px;height:41px;flex-shrink:0;object-fit:contain}
#safety-onboarding .ob-reply p{font-size:12px;line-height:1.65;margin:0;color:var(--sn-ink)}
#safety-onboarding[data-response-style="inline"] .ob-reply{background:transparent;padding:0}
#safety-onboarding .ob-options{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;min-width:0}
#safety-onboarding .ob-option{display:flex;align-items:center;gap:11px;border:1px solid var(--sn-line);border-radius:15px;padding:var(--ob-row-space,13px) 13px;min-height:53px;background:var(--sn-paper);font-size:13px;line-height:1.6}
#safety-onboarding .ob-option input{width:18px;height:18px;flex:none;margin:0;accent-color:var(--sn-ink)}
#safety-onboarding .ob-option.is-selected{background:var(--sn-lilac);border-color:#aa9fc1}
#safety-onboarding .ob-option:has(input:focus-visible){outline:2px solid var(--sn-ink);outline-offset:3px}
#safety-onboarding #ob-country{margin:0 0 10px;width:100%;min-width:0}
#safety-onboarding #ob-note{min-height:170px;font-size:16px;background:#fffdf9}
#safety-onboarding .ob-hope{padding:19px 20px;background:var(--sn-lilac);border-radius:19px;margin:0 0 18px}
#safety-onboarding .ob-hope small{margin:0 0 10px}

#safety-onboarding .ob-hope p:last-child{margin-bottom:0}
#safety-onboarding .ob-summary-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--sn-line)}
#safety-onboarding .ob-summary-row>div{min-width:0}
#safety-onboarding .ob-summary-row small{margin:0 0 6px;font-size:11px}
#safety-onboarding .ob-summary-row p{font-size:12px;line-height:1.7;margin:0;color:var(--sn-ink);overflow-wrap:anywhere}
#safety-onboarding .ob-summary-row button{flex-shrink:0;min-width:44px}
#safety-onboarding .ob-review{margin-top:10px}
#safety-onboarding .ob-review .ob-summary-row:last-child{border:0}
#safety-onboarding .ob-ideas h1{margin-top:18px}
#safety-onboarding .ob-ideas .sn-tag{align-self:flex-start}
#safety-onboarding .ob-ideas .sn-idea{padding:19px 0}
#safety-onboarding .ob-ideas .ob-footer{padding-bottom:2px}

#safety-onboarding .ob-interests h1{font-size:38px;line-height:1.1;margin:12px 0 15px}

#safety-onboarding .ob-interest-grid{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:flex-start}
#safety-onboarding .ob-interest-tile{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--sn-line);border-radius:999px;padding:12px 15px;background:var(--sn-paper);color:var(--sn-ink);min-height:44px;min-width:0;max-width:100%;text-align:left;transition:background-color .16s ease}
#safety-onboarding .ob-interest-tile[aria-pressed="true"]{background:var(--sn-lilac);border-color:#a99dc1}
#safety-onboarding .ob-interest-label{font-size:12px;line-height:1.5;overflow-wrap:anywhere}
#safety-onboarding .ob-interest-check{display:flex;align-items:center;justify-content:center;flex:none;width:15px;height:15px;color:var(--sn-muted)}
#safety-onboarding .ob-interest-tile[aria-pressed="true"] .ob-interest-check{color:var(--ob-action,#3e5044)}
#safety-onboarding .ob-interest-check svg{width:14px;height:14px}
#safety-onboarding .ob-interests .ob-footer{padding-top:28px}
#safety-onboarding .ob-footer>.ob-interest-count{margin:0 0 14px;font-size:11px}

#safety-onboarding .ob-idea-topic{display:block;font-size:11px;color:var(--sn-muted);margin:0 0 7px}

</style>

 const state={page:'welcome',explorePage:'categories',category:'sick',drafts:{},saved:[],done:[],awards:[],task:'sick0',origin:'ideas',helpOrigin:'list',notice:'',undo:null,pending:null,authOrigin:'welcome',signedIn:false,email:'you@example.com',authError:'',codeExpired:false,elephantName:'',batches:{},generation:null};

 const top=(back,label='My list')=>`<div class="sn-top">${back?button(back,icon('chevron-left')+esc(label)):'<span class="sn-wordmark">My Safety</span>'}${back?img('sn-mini'):button('account',icon('user-round'),'sn-icon','aria-label="Account and help"')}</div>`;
 const draft=()=>state.drafts[state.category]||(state.drafts[state.category]={selected:[],text:''});
 const category=()=>topics.find(t=>t.id===state.category);
 const validDraft=()=>draft().selected.length>0||draft().text.trim().length>0;

 const row=id=>{const t=taskMap[id],done=state.done.includes(id);return `<div class="sn-row">${button('toggle',`<span class="sn-circle ${done?'done':''}">${done?icon('check'):''}</span>`,'sn-check',`data-id="${id}" aria-label="${done?'Undo completion of':'Complete'} ${esc(t.title)}"`)}${button('task',esc(t.title)+`<small>${done?'Completed':esc(interestTaskLabelText(t.id)||topics.find(c=>c.id===t.category).label)+' · '+t.time+' min'}</small>`,'sn-open',`data-id="${id}"`)}${button('taskmenu',icon('ellipsis'),'sn-icon',`data-id="${id}" aria-label="Options for ${esc(t.title)}"`)}</div>`;};
 function signin(){return `${top('authback','Back')}<div class="sn-auth-art">${img('sn-mini')}</div><h1>Keep your<br>little wins.</h1><p>Sign in with email to keep your list and grow together.</p>${state.pending?`<div class="sn-outcome"><strong>Ready to add</strong>${esc(taskMap[state.pending].title)}</div>`:''}<form data-form="email"><label class="sn-field-label" for="sn-email">Email address</label><input class="sn-input" id="sn-email" name="email" type="email" autocomplete="email" required value="${esc(state.email)}"><button class="sn-primary cursor-interaction" type="button" data-action="submitform">Email me a code</button></form>${button('authback','Keep exploring','sn-secondary')}<p class="sn-fine">New here? Your account starts with the same step.</p>`;}
 function code(){return `${top('emailback','Email')}<h1>Check your<br>inbox.</h1><p>Enter the code for<br><strong>${esc(state.email)}</strong></p><form data-form="code"><label class="sn-field-label" for="sn-code">Six-digit code</label><input class="sn-input sn-code" id="sn-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required aria-describedby="sn-code-help${state.authError?' sn-code-error':''}" ${state.authError?'aria-invalid="true"':''}><small id="sn-code-help">Preview code: 123456. No email is sent.</small>${state.authError?`<p class="sn-error" id="sn-code-error" role="alert">${esc(state.authError)}</p>`:''}<button class="sn-primary cursor-interaction" type="button" data-action="submitform">Continue</button></form>${button('resend','Send a new code','sn-secondary')}${button('emailback','Use another email','sn-secondary')}${state.notice?`<p class="sn-fine" role="status">${esc(state.notice)}</p>`:''}`;}
 function list(){const active=state.saved.filter(id=>!state.done.includes(id)),done=state.saved.filter(id=>state.done.includes(id));if(!state.signedIn)return `${top()}<h1>My list</h1><div class="sn-empty">${img('sn-mini')}<p>A little place for the things you want to do.</p>${button('signin','Sign in with email','sn-primary')}${button('explore','Explore first','sn-secondary')}</div>`;return `${top()}<h1>My list</h1><div class="sn-companion">${img('')}<div><h2>${state.elephantName?esc(state.elephantName)+' & you':'Growing together'}</h2><p>${state.awards.length?state.awards.length+' little win'+(state.awards.length===1?'':'s')+' together':'Ready when you are.'}</p>${state.awards.length>=5?`<small>${stage()}</small>`:''}</div></div>${notice()}${active.length?`<div class="sn-section"><h2>At your own pace</h2>${button('explore',icon('plus')+' Find a task')}</div>${active.map(row).join('')}`:`<div class="sn-empty"><h2>${done.length?'A little room to breathe.':'Your list starts here.'}</h2><p>${done.length?'You’ve finished what you chose. It’s okay to stop here.':'Choose one small thing you’d like to make easier.'}</p>${button('explore',done.length?'Explore when you’re ready':'Find my first task',done.length?'sn-secondary':'sn-primary')}</div>`}${done.length?`<details class="sn-done-list"><summary class="cursor-interaction">Completed · ${done.length}${icon('chevron-down')}</summary>${done.map(row).join('')}</details>`:''}`;}
 function categories(){return `${top()}<h1>What’s on<br>your mind?</h1>${topics.map(t=>button('category',icon(({people:'users',peace:'leaf',sick:'heart',daily:'sun',home:'house'})[t.id])+`<span>${esc(t.label)}</span><span class="sn-next">${icon('chevron-right')}</span>`,'sn-choice',`data-id="${t.id}"`)).join('')}`;}
 function concerns(){const d=draft();return `${top('categories','Categories')}<span class="sn-tag">${esc(category().label)}</span><h1 style="margin-top:18px">Where shall<br>we start?</h1>${category().items.map((v,i)=>`<label class="sn-choice cursor-interaction"><input type="checkbox" data-concern="${i}" ${d.selected.includes(i)?'checked':''}><span>${esc(v[0])}</span></label>`).join('')}<label class="sn-field-label" for="sn-manual">Something else? <span>(optional)</span></label><textarea id="sn-manual" maxlength="300" placeholder="A little about what’s on your mind…">${esc(d.text)}</textarea>${button('generate','See task ideas','sn-primary',validDraft()?'':'disabled')}`;}
 function ideas(){const ids=state.batches[state.category]||catalog[state.category].map((_,i)=>state.category+i);return `${top('concerns','Your choices')}<span class="sn-tag">${esc(category().label)}</span><h1 style="margin-top:18px">A few small<br>places to start.</h1>${ids.map(id=>{const t=taskMap[id],saved=state.saved.includes(id);return `<div class="sn-idea"><div class="sn-idea-head">${button('task',esc(t.title)+`<small>${t.time} min</small>`,'sn-open',`data-id="${id}"`)}${button('add',icon(saved?'check':'plus'),'sn-add',`data-id="${id}" aria-label="${saved?'Added':'Add'} ${esc(t.title)}" ${saved?'disabled':''}`)}</div><p>${esc(t.description)}</p></div>`;}).join('')}${notice()}${button('list','Go to my list','sn-primary')}${button('more','Try another batch','sn-secondary')}`;}
 function detail(){const t=taskMap[state.task],saved=state.saved.includes(t.id),done=state.done.includes(t.id);return `${top('taskback',['ideas','firstideas'].includes(state.origin)?'Task ideas':'My list')}<div class="sn-meta"><span class="sn-tag">${esc(interestTaskLabelText(t.id)||topics.find(c=>c.id===t.category).label)}</span>${t.time} min</div><h1>${esc(t.title)}.</h1><p>${esc(t.description)}</p><ol class="sn-steps">${t.steps.map((s,i)=>`<li><span class="sn-number">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ol><div class="sn-outcome"><strong>Done when</strong>${esc(t.done)}</div>${t.id==='sick0'?`<details><summary class="cursor-interaction">Helpful link<span>1 ${icon('chevron-down')}</span></summary><a href="https://www.redcross.org/get-help/how-to-prepare-for-emergencies/survival-kit-supplies.html" target="_blank" rel="noopener noreferrer">Red Cross supply checklist ${icon('arrow-up-right')}</a><p>A broader emergency guide. Use the relevant supply ideas; you don’t need to buy a full kit.</p></details><details><summary class="cursor-interaction">If you’re buying food${icon('chevron-down')}</summary><ul><li>Fits your dietary needs.</li><li>Easy to open and prepare.</li><li>Storage requirements suit your space.</li></ul></details>`:''}${button(saved?(done?'undoTask':'complete'):'addDetail',done?'Undo completion':saved?'Mark as done':'+ Add to my list','sn-primary')}`;}
 function taskmenu(){return `${top('list')}<h1>This task,<br>your choice.</h1><div class="sn-outcome">${esc(taskMap[state.task].title)}</div>${button('openCurrent','Open task','sn-primary')}${button('remove','Remove from my list','sn-secondary')}<p class="sn-fine">You can undo removal. Your elephant’s growth stays.</p>`;}
 function celebration(){const t=state.undo?.id&&taskMap[state.undo.id],n=state.awards.length;return `${top('list')}<div class="sn-celebrate"><h1>${n===1?'A little care<br>for future you.':'Look at us<br>growing.'}</h1>${img('sn-reward-elephant')}<p>${t?.id==='sick0'?'Your essentials are together, with any missing item noted.':t?'You finished “'+esc(t.title)+'.”':'Small actions, becoming a story together.'}</p>${button('highfive','Tiny trunk high-five?','sn-secondary')}<div class="sn-outcome"><strong>${esc(elephantName())} & you</strong>${n} little win${n===1?'':'s'} together${n>=5?'<br>'+stage():''}</div>${button('list','Back to my list','sn-primary')}${state.undo?button('undo','Undo completion','sn-secondary'):''}</div>`;}
 function loading(){return `${top('cancelgeneration','Your choices')}<div class="sn-empty">${img('sn-mini')}<h1>A moment<br>for your ideas.</h1><p role="status">Finding a few manageable places to start…</p>${button('list','Go to my list','sn-primary')}${button('cancelgeneration','Change my choices','sn-secondary')}</div>`;}
 function generationerror(){return `${top('concerns','Your choices')}<div class="sn-empty"><h1>A small<br>pause.</h1><p>We couldn’t get your ideas this time. Your choices and saved tasks are still here.</p>${button('retry','Try again','sn-primary')}${state.batches[state.category]?button('previousbatch','Keep my previous ideas','sn-secondary'):''}${button('concerns','Change my choices','sn-secondary')}${button('list','Go to my list','sn-secondary')}</div>`;}
 function exhausted(){return `${top('concerns','Your choices')}<div class="sn-empty"><h1>Let’s leave<br>a little space.</h1><p>No new ideas for these choices right now. You can keep what feels useful or try another concern.</p>${state.batches[state.category]?button('previousbatch','See my previous ideas','sn-primary'):''}${button('concerns','Change my choices','sn-secondary')}${button('list','Go to my list','sn-secondary')}</div>`;}
 function account(){return `${top('accountback','Back')}<h1>A little<br>about you.</h1>${state.signedIn?`<p>Signed in for this preview.</p><form data-form="name"><label class="sn-field-label" for="sn-name">Your elephant’s name <span>(optional)</span></label><input class="sn-input" id="sn-name" maxlength="24" value="${esc(state.elephantName)}" placeholder="Choose a name"><button type="button" data-action="submitform" class="sn-primary cursor-interaction">Save name</button></form>${notice()}${button('signout','Sign out','sn-secondary')}`:button('signin','Sign in with email','sn-primary')}${button('help','A little help','sn-secondary')}`;}
 function help(){return `${top('helpback','Back')}<h1>A little help.</h1><details open><summary class="cursor-interaction">How do I start?${icon('chevron-down')}</summary><p>Explore a category, choose your concerns, then add useful ideas to My list.</p></details><details><summary class="cursor-interaction">Can I change my mind?${icon('chevron-down')}</summary><p>Use the options beside a task to remove it. You can undo removal and completion.</p></details><details><summary class="cursor-interaction">What does growth mean?${icon('chevron-down')}</summary><p>Your elephant celebrates completed actions. It doesn’t measure safety, and it never loses growth when you take a break.</p></details>${button('list','Back to my list','sn-primary')}`;}
 const pages={signin,code,list,categories,concerns,ideas,detail,taskmenu,celebration,loading,generationerror,exhausted,account,help};
 function render(){content.innerHTML=pages[state.page]();const explore=['categories','concerns','ideas','loading','generationerror','exhausted'].includes(state.page);nav.hidden=!(explore||state.page==='list');nav.innerHTML=button('list',icon('list-checks')+' My list','','aria-current="'+(state.page==='list'?'page':'false')+'"')+button('explore',icon('compass')+' Explore','','aria-current="'+(explore?'page':'false')+'"');if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});root.querySelector('.sn-phone').dataset.page=state.page;root.querySelector('.sn-phone').dataset.growth=state.awards.length>=15?'friendship':state.awards.length>=5?'rhythm':'first';}
 function save(){const privateContent={version:'v0-flow-v1',page:state.page,signedIn:state.signedIn,saved:state.saved,done:state.done,awards:state.awards,task:state.task,category:state.category,elephantName:state.elephantName};lastSaved=JSON.stringify(privateContent);if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{flow_design:'Email-code sign-in, task removal/undo, empty and finished lists, recoverable generation, and gentle elephant growth. All behavior is simulated.'},privateContent}).catch(()=>{});}
 function restore(snapshot){const p=snapshot?.privateContent;if(p?.version!=='v0-flow-v1')return;for(const k of ['saved','done','awards'])if(Array.isArray(p[k]))state[k]=[...new Set(p[k].filter(id=>taskMap[id]))];state.signedIn=p.signedIn===true;if(taskMap[p.task])state.task=p.task;if(topics.some(t=>t.id===p.category))state.category=p.category;if(typeof p.elephantName==='string')state.elephantName=p.elephantName.slice(0,24);state.page=state.signedIn?'list':'signin';state.pending=state.signedIn?null:'sick0';}
 function finish(message){render();save();if(message)root.querySelector('.sn-sr').textContent=message;}
 function beginSignIn(id=null){state.pending=id;state.authOrigin=state.page;state.page='signin';state.authError='';state.notice='';}
 function add(id){if(!state.signedIn){beginSignIn(id);return;}if(!state.saved.includes(id))state.saved.push(id);state.notice='Added to your list.';state.undo=null;}
