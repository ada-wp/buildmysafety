<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap">
<div id="safety-navigation" aria-label="My Safety navigation design">
  <div class="sn-phone"><div class="sn-content"></div><nav class="sn-nav" aria-label="Main navigation"></nav></div>
  <div class="sn-sr" role="status" aria-live="polite"></div>
</div>
<style>
#safety-navigation{--sn-paper:#faf7f2;--sn-ink:#2e2b4d;--sn-muted:#696376;--sn-lilac:#eee8f6;--sn-line:#e3dce6;--sn-radius:28px;font-family:Inter,Arial,sans-serif;color:var(--sn-ink);max-width:393px;margin:0 auto}
#safety-navigation *{box-sizing:border-box}
#safety-navigation .sn-phone{background:var(--sn-paper);border-radius:var(--sn-radius);min-height:700px;display:flex;flex-direction:column;overflow:hidden}
#safety-navigation .sn-content{padding:22px 24px 26px;flex:1}
#safety-navigation button,#safety-navigation input,#safety-navigation textarea{font:inherit;color:inherit}
#safety-navigation button{background:none;border:0;min-height:44px}
#safety-navigation button:disabled{opacity:.45}
#safety-navigation .sn-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:22px}
#safety-navigation .sn-wordmark{font-size:13px;letter-spacing:.02em}
#safety-navigation .sn-text{font-size:12px;color:var(--sn-muted);padding:0;display:inline-flex;align-items:center;gap:5px}
#safety-navigation .sn-icon{min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:10px}
#safety-navigation h1{font-family:'Instrument Serif',Georgia,serif;font-size:44px;line-height:1.04;letter-spacing:-.6px;font-weight:400;margin:0 0 20px}
#safety-navigation h2{font-size:14px;font-weight:500;margin:0}
#safety-navigation p{font-size:14px;line-height:1.7;margin:0 0 20px;color:var(--sn-muted)}
#safety-navigation .sn-companion{display:flex;align-items:center;gap:16px;margin:2px 0 26px;padding:15px 17px;background:var(--sn-lilac);border-radius:20px}
#safety-navigation .sn-companion img{width:72px;height:72px;object-fit:contain}
#safety-navigation .sn-companion p{font-size:12px;margin:5px 0 0}
#safety-navigation .sn-mini{width:42px;height:42px;object-fit:contain}
#safety-navigation .sn-section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
#safety-navigation .sn-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sn-line);padding:12px 0}
#safety-navigation .sn-check{flex:none;width:44px;padding:10px;display:grid;place-items:center}
#safety-navigation .sn-circle{border:1px solid #afa6bc;border-radius:50%;height:23px;width:23px;display:grid;place-items:center}
#safety-navigation .sn-circle.done{background:var(--sn-ink);color:var(--sn-paper);border-color:var(--sn-ink)}
#safety-navigation .sn-open{font-size:14px!important;text-align:left;flex:1;padding:3px 0;line-height:1.5;display:block}
#safety-navigation small{display:block;font-size:11px;color:var(--sn-muted);line-height:1.5;margin-top:5px}
#safety-navigation .sn-nav{display:flex;gap:8px;padding:12px 20px 20px;border-top:1px solid var(--sn-line);background:var(--sn-paper)}
#safety-navigation .sn-nav[hidden]{display:none}
#safety-navigation .sn-nav button{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;border-radius:19px;min-height:50px;font-size:13px}
#safety-navigation .sn-nav button[aria-current="page"]{background:var(--sn-lilac);font-weight:500}
#safety-navigation .sn-primary{width:100%;min-height:50px;border-radius:28px;background:var(--sn-ink);color:var(--sn-paper);padding:14px 18px;font-size:13px;font-weight:500;margin-top:24px;line-height:1.5}
#safety-navigation .sn-secondary{width:100%;font-size:12px;color:var(--sn-muted);margin-top:4px}
#safety-navigation .sn-choice{display:flex;align-items:center;gap:14px;min-height:67px;width:100%;text-align:left;border-bottom:1px solid var(--sn-line);padding:13px 0;font-size:14px}
#safety-navigation .sn-choice .sn-next{margin-left:auto}
#safety-navigation .sn-choice input{accent-color:var(--sn-ink);height:19px;width:19px;flex:none}
#safety-navigation .sn-choice span{line-height:1.6}
#safety-navigation .sn-field-label{display:block;font-size:12px;margin:22px 0 8px}
#safety-navigation textarea{display:block;width:100%;min-height:84px;resize:vertical;border:1px solid var(--sn-line);border-radius:14px;padding:12px;background:var(--sn-paper);font-size:16px;line-height:1.5}
#safety-navigation .sn-tag{display:inline-block;font-size:11px;line-height:1.5;background:var(--sn-lilac);border-radius:24px;padding:6px 10px;margin-right:9px}
#safety-navigation .sn-meta{font-size:12px;color:var(--sn-muted);margin-bottom:15px}
#safety-navigation .sn-idea{border-bottom:1px solid var(--sn-line);padding:18px 0}
#safety-navigation .sn-idea-head{display:flex;gap:8px;align-items:start}
#safety-navigation .sn-idea p{font-size:12px;margin:7px 0 0}
#safety-navigation .sn-add{flex:none;width:44px;border:1px solid var(--sn-line);border-radius:50%;display:grid;place-items:center}
#safety-navigation .sn-add[disabled]{opacity:1;background:var(--sn-lilac);border-color:var(--sn-lilac)}
#safety-navigation .sn-steps{list-style:none;padding:0;display:grid;gap:20px;margin:25px 0}
#safety-navigation .sn-steps li{display:grid;grid-template-columns:27px 1fr;gap:12px;font-size:13px;line-height:1.65}
#safety-navigation .sn-number{border-radius:50%;height:27px;background:var(--sn-lilac);display:grid;place-items:center;font-size:11px}
#safety-navigation .sn-outcome{padding:15px 16px;background:#f1ede8;border-radius:15px;font-size:12px;line-height:1.65;margin-bottom:20px}
#safety-navigation .sn-outcome strong{font-weight:500;font-size:11px;display:block;margin-bottom:4px}
#safety-navigation details{border-bottom:1px solid var(--sn-line)}
#safety-navigation summary{min-height:50px;padding:12px 0;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none}
#safety-navigation summary::-webkit-details-marker{display:none}
#safety-navigation details p,#safety-navigation details li{font-size:12px;line-height:1.65}
#safety-navigation details a{color:var(--sn-ink);display:inline-block;padding:10px 0;font-size:12px}
#safety-navigation details ul{padding:0 0 12px 18px;margin:0}
#safety-navigation .sn-celebrate{text-align:center;padding:5px 0 14px}
#safety-navigation .sn-celebrate>img{width:175px;height:175px;margin:16px 0}
#safety-navigation .sn-celebrate h1{margin-top:22px}
#safety-navigation .sn-note{background:var(--sn-lilac);padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.6;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#safety-navigation .sn-empty{padding:38px 8px;text-align:center}
#safety-navigation .sn-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#safety-navigation .sn-done-list{margin-top:20px}
#safety-navigation .sn-done-list .sn-row:last-child{border:0}
@media(max-width:359px){#safety-navigation .sn-content{padding-left:20px;padding-right:20px}#safety-navigation h1{font-size:39px}}
</style>
<script>

 const catalog={
 sick:[['Set up a sick-day shelf','10','A few essentials within reach when you need to rest.',['Choose a reachable shelf or basket near where you usually rest.','Gather familiar easy-to-prepare food, tissues and a charging cable you already own.','Note one missing item for your next usual shopping trip.'],'Your essentials are together, with any missing item noted.'],['Choose two easy meals','5','Make low-energy days a little easier.',['Choose two familiar meals that take little effort.','Check what you already have for them.','Put any missing ingredients on your usual shopping list.'],'You have two meal ideas and know what you need.'],['Draft a check-in message','5','Prepare a small, clear request you could send when you need company.',['Think of someone you feel comfortable asking.','Draft a message naming the kind of check-in you would like.','Save it somewhere you can find easily.'],'Your message is saved; sending it is your choice.']],
 daily:[['Choose one low-effort meal','5','Keep one familiar option ready for a busy day.'],['Make a ten-minute tidy list','5','Choose a small area and three manageable actions.'],['Put appointments in one place','10','Bring upcoming dates into the calendar you already use.']],
 home:[['Save a repair contact','10','Find the contact information you would use for an ordinary home repair.'],['Find your flashlight','5','Put a working light somewhere easy to reach.'],['Write down your repair questions','5','Prepare what to ask before arranging a repair.']],
 people:[['Draft a small help request','5','Name one specific favor you would feel comfortable asking for.'],['Plan a simple catch-up','5','Choose someone you would enjoy hearing from.'],['Find one local gathering','10','Look for an activity that fits your interests and energy.']],
 peace:[['Make a gentle evening cue','5','Choose a familiar activity that helps you wind down.'],['Write one visiting boundary','5','Find words for a preference you would like visitors to respect.'],['Plan a little connection','5','Choose one comfortable way to connect this week.']]
 };
 const taskMap={};for(const topic of topics)catalog[topic.id].forEach((t,i)=>taskMap[topic.id+i]={id:topic.id+i,category:topic.id,title:t[0],time:t[1],description:t[2],steps:t[3]||['Choose a small version that fits your day.','Write down the person, place or item you want to start with.','Save your next practical step somewhere you can find it.'],done:t[4]||'You have a specific next step written down.'});
 const state={page:'list',explorePage:'categories',category:'sick',drafts:{},saved:['sick0','sick1'],done:[],awards:[],task:'sick0',origin:'list',helpOrigin:'list',notice:'',lastDone:null};
 const styling={navStyle:'pill'};
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const img=cls=>`<img class="${cls}" src="${ELEPHANT}" alt="Lavender elephant companion">`;
 const button=(action,label,cls='sn-text',extra='')=>`<button type="button" class="${cls} cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
 const top=(back,label='My list')=>`<div class="sn-top">${back?button(back,icon('chevron-left')+esc(label)):'<span class="sn-wordmark">My Safety</span>'}${back?img('sn-mini'):button('help',icon('circle-help'),'sn-icon','aria-label="Help"')}</div>`;
 const draft=()=>state.drafts[state.category]||(state.drafts[state.category]={selected:[],text:''});
 const category=()=>topics.find(t=>t.id===state.category);
 const validDraft=()=>draft().selected.length>0||draft().text.trim().length>0;
 const row=(id)=>{const t=taskMap[id],done=state.done.includes(id);return `<div class="sn-row">${button('toggle',`<span class="sn-circle ${done?'done':''}">${done?icon('check'):''}</span>`,'sn-check',`data-id="${id}" aria-label="${done?'Undo completion of':'Complete'} ${esc(t.title)}"`)}${button('task',esc(t.title)+`<small>${done?'Completed':esc(topics.find(c=>c.id===t.category).label)+' · '+t.time+' min'}</small>`,'sn-open',`data-id="${id}"`)}${icon('chevron-right')}</div>`;};
 function list(){const active=state.saved.filter(id=>!state.done.includes(id)),done=state.saved.filter(id=>state.done.includes(id));return `${top()}<h1>My list</h1><div class="sn-companion">${img('')}<div><h2>Growing together</h2><p>${state.awards.length?state.awards.length+' little win'+(state.awards.length===1?'':'s')+' together':'Ready when you are.'}</p></div></div><div class="sn-section"><h2>At your own pace</h2>${button('explore',icon('plus')+' Find a task')}</div>${active.length?active.map(row).join(''):`<div class="sn-empty"><p>${done.length?'A little room to breathe.':'Your first small step starts here.'}</p>${button('explore','Explore task ideas')}</div>`}${done.length?`<details class="sn-done-list"><summary class="cursor-interaction">Completed · ${done.length}${icon('chevron-down')}</summary>${done.map(row).join('')}</details>`:''}${state.notice?`<div class="sn-note"><span>${esc(state.notice)}</span>${state.lastDone?button('undo','Undo'):''}</div>`:''}`;}
 function categories(){return `${top()}<h1>What’s on<br>your mind?</h1>${topics.map(t=>button('category',icon(({people:'users',peace:'leaf',sick:'heart',daily:'sun',home:'house'})[t.id])+`<span>${esc(t.label)}</span><span class="sn-next">${icon('chevron-right')}</span>`,'sn-choice',`data-id="${t.id}"`)).join('')}`;}
 function concerns(){const d=draft();return `${top('categories','Categories')}<span class="sn-tag">${esc(category().label)}</span><h1 style="margin-top:18px">Where shall<br>we start?</h1>${category().items.map((v,i)=>`<label class="sn-choice cursor-interaction"><input type="checkbox" data-concern="${i}" ${d.selected.includes(i)?'checked':''}><span>${esc(v[0])}</span></label>`).join('')}<label class="sn-field-label" for="sn-manual">Something else? <span>(optional)</span></label><textarea id="sn-manual" maxlength="300" placeholder="A little about what’s on your mind…">${esc(d.text)}</textarea>${button('ideas','See task ideas','sn-primary',validDraft()?'':'disabled')}`;}
 function ideas(){return `${top('concerns','Your choices')}<span class="sn-tag">${esc(category().label)}</span><h1 style="margin-top:18px">A few small<br>places to start.</h1>${catalog[state.category].map((_,i)=>{const id=state.category+i,t=taskMap[id],saved=state.saved.includes(id);return `<div class="sn-idea"><div class="sn-idea-head">${button('task',esc(t.title)+`<small>${t.time} min</small>`,'sn-open',`data-id="${id}"`)}${button('add',icon(saved?'check':'plus'),'sn-add',`data-id="${id}" aria-label="${saved?'Added':'Add'} ${esc(t.title)}" ${saved?'disabled':''}`)}</div><p>${esc(t.description)}</p></div>`;}).join('')}${button('list','Go to my list','sn-primary')}${button('concerns','Change my choices','sn-secondary')}`;}
 function detail(){const t=taskMap[state.task],saved=state.saved.includes(t.id),done=state.done.includes(t.id);return `${top('taskback',state.origin==='ideas'?'Task ideas':'My list')}<div class="sn-meta"><span class="sn-tag">${esc(topics.find(c=>c.id===t.category).label)}</span>${t.time} min</div><h1>${esc(t.title)}.</h1><p>${esc(t.description)}</p><ol class="sn-steps">${t.steps.map((s,i)=>`<li><span class="sn-number">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ol><div class="sn-outcome"><strong>Done when</strong>${esc(t.done)}</div>${t.id==='sick0'?`<details><summary class="cursor-interaction">Helpful link<span>1 ${icon('chevron-down')}</span></summary><a href="https://www.redcross.org/get-help/how-to-prepare-for-emergencies/survival-kit-supplies.html" target="_blank" rel="noopener noreferrer">Red Cross supply checklist ${icon('arrow-up-right')}</a><p>A broader emergency guide. Use the relevant supply ideas; you don’t need to buy a full kit.</p></details><details><summary class="cursor-interaction">If you’re buying food${icon('chevron-down')}</summary><ul><li>Fits your dietary needs.</li><li>Easy to open and prepare.</li><li>Storage requirements suit your space.</li></ul></details>`:''}${button(saved?(done?'undoTask':'complete'):'addDetail',done?'Undo completion':saved?'Mark as done':'+ Add to my list','sn-primary')}`;}
 function celebration(){return `${top('list')}<div class="sn-celebrate"><h1>A little care<br>for future you.</h1>${img('')}<p>One useful action, done.</p><h2>${state.awards.length} little win${state.awards.length===1?'':'s'} together</h2>${button('list','Back to my list','sn-primary')}${button('undo','Undo completion','sn-secondary')}</div>`;}
 function help(){return `${top('helpback','Back')}<h1>A little help.</h1><details open><summary class="cursor-interaction">How do I start?${icon('chevron-down')}</summary><p>Open Explore, choose one category, then pick the concerns you want to work on. Add useful ideas to My list.</p></details><details><summary class="cursor-interaction">Where are my completed tasks?${icon('chevron-down')}</summary><p>Open Completed at the bottom of My list. You can undo a completion there.</p></details><details><summary class="cursor-interaction">What does elephant growth mean?${icon('chevron-down')}</summary><p>It celebrates actions you’ve completed. It doesn’t measure your safety. Taking a break never removes growth.</p></details>${button('list','Back to my list','sn-primary')}`;}
 function applySnapshot(snapshot){const p=snapshot?.privateContent;if(p?.version!=='navigation-v1')return;for(const key of ['saved','done','awards'])if(Array.isArray(p[key]))state[key]=[...new Set(p[key].filter(id=>taskMap[id]))];if(['list','categories','concerns','ideas','detail','celebration','help'].includes(p.page))state.page=p.page;if(['categories','concerns','ideas'].includes(p.explorePage))state.explorePage=p.explorePage;if(topics.some(t=>t.id===p.category))state.category=p.category;if(taskMap[p.task])state.task=p.task;state.origin=p.origin==='ideas'?'ideas':'list';state.helpOrigin=['list','categories','concerns','ideas'].includes(p.helpOrigin)?p.helpOrigin:'list';if(taskMap[p.lastDone])state.lastDone=p.lastDone;}
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{navigation:'Two tabs: My list and Explore. Detail pages have labeled back navigation.'},privateContent:{version:'navigation-v1',page:state.page,explorePage:state.explorePage,category:state.category,saved:state.saved,done:state.done,awards:state.awards,task:state.task,origin:state.origin,helpOrigin:state.helpOrigin,lastDone:state.lastDone}}).catch(()=>{});}
 function render(){content.innerHTML=({list,categories,concerns,ideas,detail,celebration,help})[state.page]();const explore=['categories','concerns','ideas'].includes(state.page);nav.hidden=!['list','categories','concerns','ideas'].includes(state.page);nav.innerHTML=button('list',icon('list-checks')+' My list','','aria-current="'+(state.page==='list'?'page':'false')+'"')+button('explore',icon('compass')+' Explore','','aria-current="'+(explore?'page':'false')+'"');nav.querySelectorAll('button').forEach(b=>b.style.borderRadius=styling.navStyle==='pill'?'19px':'8px');if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});root.querySelector('.sn-phone').dataset.page=state.page;}
 function add(id){if(!state.saved.includes(id))state.saved.push(id);state.notice='Added to your list.';}
 function complete(id){if(!state.saved.includes(id))return;const fresh=!state.awards.includes(id);if(!state.done.includes(id))state.done.push(id);if(fresh)state.awards.push(id);state.lastDone=id;state.notice='A little care for future you.';state.page=fresh&&[1,5,15].includes(state.awards.length)?'celebration':'list';}
 applySnapshot(window.openai?.widgetState);render();
 root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||!root.contains(b)||b.disabled)return;const id=b.dataset.id;switch(b.dataset.action){case'list':state.page='list';break;case'explore':state.page=state.explorePage;break;case'category':state.category=id;state.explorePage=state.page='concerns';break;case'categories':state.explorePage=state.page='categories';break;case'concerns':state.explorePage=state.page='concerns';break;case'ideas':if(!validDraft())return;state.explorePage=state.page='ideas';break;case'task':state.task=id;state.origin=state.page==='ideas'?'ideas':'list';state.page='detail';break;case'taskback':state.page=state.origin;break;case'add':add(id);break;case'addDetail':add(state.task);state.origin='list';state.page='list';break;case'complete':complete(state.task);break;case'toggle':if(state.done.includes(id)){state.done=state.done.filter(x=>x!==id);state.notice='Completion undone.';state.lastDone=null;}else complete(id);break;case'undoTask':state.done=state.done.filter(x=>x!==state.task);state.notice='Completion undone.';state.lastDone=null;state.page='list';break;case'undo':state.done=state.done.filter(x=>x!==state.lastDone);state.notice='Completion undone.';state.lastDone=null;state.page='list';break;case'help':state.helpOrigin=state.page;state.page='help';break;case'helpback':state.page=state.helpOrigin;break;default:return;}render();save();root.querySelector('.sn-sr').textContent=state.page==='list'?'My list.':state.page==='celebration'?'Task marked done.':state.page==='detail'?'Task details.':b.dataset.action==='add'?'Added to your list.':state.page==='ideas'?'Task ideas.':state.page==='concerns'?'Choose your concerns.':state.page==='categories'?'Choose a category.':'Help.';});
 root.addEventListener('change',e=>{if(e.target.matches('[data-concern]')){const d=draft(),v=Number(e.target.dataset.concern);d.selected=e.target.checked?[...new Set([...d.selected,v])]:d.selected.filter(x=>x!==v);root.querySelector('[data-action="ideas"]').disabled=!validDraft();}});
 root.addEventListener('input',e=>{if(e.target.id==='sn-manual'){draft().text=e.target.value;root.querySelector('[data-action="ideas"]').disabled=!validDraft();}});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){applySnapshot(e.detail.globals.widgetState);render();}});
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(styling,'navStyle',{label:'Navigation highlight',options:[{label:'Soft pill',value:'pill'},{label:'Soft square',value:'square'}]});}
})();
</script>
